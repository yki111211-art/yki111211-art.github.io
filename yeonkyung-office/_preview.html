<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미리보기 · 연경 오피스</title>
<style>
  body{margin:0;background:#e8e2d6;font-family:system-ui,sans-serif;padding:16px}
  .row{display:flex;gap:18px;align-items:flex-start}
  .phone{border-radius:32px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);border:8px solid #1c1a17;background:#fff}
  iframe{border:0;display:block;width:390px;height:800px}
  .tall iframe{width:768px;height:800px}
  .cap{font-size:12px;color:#5b5348;margin:6px 2px}
</style>
</head>
<body>
<div class="row">
  <div>
    <div class="cap">iPhone 390×800</div>
    <div class="phone"><iframe src="./index.html"></iframe></div>
  </div>
  <div>
    <div class="cap">태블릿 768×800</div>
    <div class="phone tall"><iframe src="./index.html"></iframe></div>
  </div>
</div>
<script>
  document.querySelectorAll('iframe').forEach(function (f) {
    f.src = './index.html?t=' + Date.now();
  });
</script>
</body>
</html>
